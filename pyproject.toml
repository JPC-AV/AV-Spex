[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "AV_Spex"
version = "1.5.9"
description = "A Python project written for NMAAHC media conservation lab"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  { name="Eddy Colloton", email="eddy.colloton@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)"
]
dependencies = [
    "appdirs==1.4.4",
    "colorlog==6.7.0",
    "art==6.1",
    "lxml>=5.2.0",
    "plotly==5.23.0",
    "toml==0.10.2",
    "PyQt6>=6.7.1",
    "numpy>=2.0.0",
    # macOS x86_64 wheels stopped bundling FFmpeg at 4.13.0.90 — they ship no
    # libavcodec/libavformat and report "FFMPEG: NO", leaving AVFoundation as
    # the only videoio backend, which cannot open FFV1/Matroska. cv2.VideoCapture
    # then fails on every source file and reports -1 for width/height, which
    # frame_analysis turns into a degenerate crop. 4.12.0.88 is the last x86_64
    # release with FFmpeg; arm64 wheels are unaffected and stay unpinned.
    # (PEP 508 has no unary "not", hence the De Morgan form on the second entry.)
    "opencv-python-headless>=4.10.0,<4.13; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "opencv-python-headless>=4.10.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "scipy>=1.14.0",
    "matplotlib>=3.9.0",
]

[project.urls]
Repository = "https://github.com/JPC-AV/JPC_AV_videoQC"

[project.scripts]
av-spex = "AV_Spex.av_spex_the_file:main_cli"

[project.gui-scripts]
av-spex-gui = "AV_Spex.av_spex_the_file:main_gui"

[tool.setuptools.packages.find]
where = ["src"]
include = ["AV_Spex*"]
exclude = ["tests"]
namespaces = false

[tool.setuptools.package-data]
"AV_Spex" = [
    "config/*.json",
    "config/help/*.md",
    "config/help/*.png",
    "config/mediaconch_policies/*.xml",
    "config/clams_bars/*.png",
    "config/clams_bars/LICENSE",
    "logo_image_files/*.png"
]

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
